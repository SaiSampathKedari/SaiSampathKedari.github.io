.feature, .tile { display: grid; grid-template-columns: 260px minmax(0, 1fr); column-gap: 32px; align-items: start; }

.tile video.media { aspect-ratio: 4 / 3; object-fit: cover; background: #f3f3f4; }

.org .when { align-self: start; padding-top: 1.5px; }
